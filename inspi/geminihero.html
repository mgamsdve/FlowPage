<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Web Design Agency</title>
  <style>
    /* --- CSS Variables for precise editorial styling --- */
    :root {
      --bg-color: #F7F6F2;           /* Soft, warm off-white */
      --text-main: #1C1B1A;          /* Deep charcoal, softer than pure black */
      --text-muted: #6B6A68;         /* Editorial grey for paragraphs */
      --accent-warm: #D36B46;        /* Single warm terracotta/orange accent */
      
      --shape-fill: rgba(28, 27, 26, 0.03);   /* Barely-there element fill */
      --shape-border: rgba(28, 27, 26, 0.08); /* Delicate element outlines */
    }

    /* --- Reset & Base --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Inter", sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* --- Hero Container --- */
    .hero {
      position: relative;
      width: 100vw;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* --- Abstract Floating Background Elements --- */
    .abstract-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; /* Prevents shapes from blocking clicks */
      z-index: 1;
    }

    .shape {
      position: absolute;
      will-change: transform;
    }

    /* Left Side Elements */
    .shape-1 {
      /* Soft Rectangle */
      width: 120px;
      height: 160px;
      border: 1px solid var(--shape-border);
      border-radius: 40px;
      top: 25%;
      left: 12%;
      animation: float-slow 23s ease-in-out infinite alternate;
    }

    .shape-2 {
      /* Thin vertical line */
      width: 1px;
      height: 200px;
      background-color: var(--shape-border);
      bottom: 20%;
      left: 22%;
      animation: float-vertical 19s ease-in-out infinite alternate;
    }

    .shape-3 {
      /* Small Accent Circle */
      width: 16px;
      height: 16px;
      background-color: var(--accent-warm);
      border-radius: 50%;
      opacity: 0.8;
      top: 45%;
      left: 18%;
      animation: breathe 17s ease-in-out infinite alternate;
    }

    /* Right Side Elements */
    .shape-4 {
      /* Hollow Circle */
      width: 240px;
      height: 240px;
      border: 1px solid var(--shape-border);
      border-radius: 50%;
      bottom: 15%;
      right: 8%;
      animation: float-slow 29s ease-in-out infinite alternate-reverse;
    }

    .shape-5 {
      /* Filled Soft Circle */
      width: 90px;
      height: 90px;
      background-color: var(--shape-fill);
      border-radius: 50%;
      top: 30%;
      right: 18%;
      animation: float-horizontal 21s ease-in-out infinite alternate;
    }

    .shape-6 {
      /* Thin horizontal line */
      width: 120px;
      height: 1px;
      background-color: var(--shape-border);
      top: 65%;
      right: 12%;
      animation: float-vertical 25s ease-in-out infinite alternate-reverse;
    }

    /* --- Centered Content (Foreground) --- */
    .content-wrapper {
      position: relative;
      z-index: 2;
      max-width: 720px;
      text-align: center;
      padding: 0 2rem;
    }

    /* Agency Badge/Kicker */
    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    .kicker-dot {
      width: 6px;
      height: 6px;
      background-color: var(--accent-warm);
      border-radius: 50%;
    }

    /* Headline */
    h1 {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      line-height: 1.05;
      font-weight: 400; /* Lighter weight for editorial elegance */
      letter-spacing: -0.03em;
      margin-bottom: 1.5rem;
      color: var(--text-main);
    }

    /* The 'Italic' trend in modern high-end web design */
    h1 i {
      font-family: "Playfair Display", "Times New Roman", Times, serif;
      font-style: italic;
      padding-right: 0.1em;
    }

    /* Paragraph */
    p {
      font-size: clamp(1rem, 1.5vw, 1.125rem);
      line-height: 1.6;
      color: var(--text-muted);
      max-width: 500px;
      margin: 0 auto 3rem auto;
      font-weight: 400;
    }

    /* Call to Action */
    .cta-group {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .cta-btn {
      display: inline-block;
      padding: 1.1rem 2.5rem;
      background-color: var(--text-main);
      color: var(--bg-color);
      text-decoration: none;
      border-radius: 100px; /* Pill shape */
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      border: 1px solid var(--text-main);
    }

    .cta-btn:hover {
      background-color: transparent;
      color: var(--text-main);
      transform: translateY(-2px);
    }

    /* --- Keyframe Animations --- */
    @keyframes float-slow {
      0% { transform: translate(0, 0) rotate(0deg); }
      100% { transform: translate(20px, -30px) rotate(5deg); }
    }

    @keyframes float-vertical {
      0% { transform: translateY(0); }
      100% { transform: translateY(-40px); }
    }

    @keyframes float-horizontal {
      0% { transform: translateX(0); }
      100% { transform: translateX(30px); }
    }

    @keyframes breathe {
      0% { transform: scale(1) translateY(0); opacity: 0.7; }
      100% { transform: scale(1.15) translateY(-15px); opacity: 1; }
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      /* Hide extreme outer shapes on mobile to avoid clutter */
      .shape-1, .shape-4 { display: none; }
      .shape-2 { left: 5%; }
      .shape-6 { right: 5%; }
    }
  </style>
</head>
<body>

  <section class="hero">
    
    <!-- Abstract Background Surroundings -->
    <div class="abstract-layer">
      <!-- Left side -->
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <div class="shape shape-3"></div>
      
      <!-- Right side -->
      <div class="shape shape-4"></div>
      <div class="shape shape-5"></div>
      <div class="shape shape-6"></div>
    </div>

    <!-- Centered Content -->
    <div class="content-wrapper">
      
      <div class="kicker">
        <span class="kicker-dot"></span>
        Digital Design Agency
      </div>
      
      <h1>Crafting <i>elegant</i> digital experiences.</h1>
      
      <p>We blend editorial aesthetics with rigorous digital engineering to build platforms that command quiet authority.</p>
      
      <div class="cta-group">
        <a href="#" class="cta-btn">View Our Work</a>
      </div>

    </div>

  </section>

</body>
</html>
